<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Live League Points</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: calc(100vw - 40px);
            height: calc(100vh - 40px);
            margin: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            gap: 15px;
            flex-shrink: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95em;
        }

        .nav-arrow {
            cursor: pointer;
            font-size: 24px;
            color: #667eea;
            user-select: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .nav-arrow:hover {
            background: #f0f0f0;
        }

        .nav-arrow.disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .nav-arrow.disabled:hover {
            background: transparent;
        }

        .last-updated {
            color: #999;
            font-size: 0.75em;
            font-weight: normal;
            margin-left: 10px;
        }

        .league-id-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-id-input input {
            padding: 6px 8px;
            font-size: 13px;
            border: 2px solid #667eea;
            border-radius: 5px;
            width: 100px;
            text-align: center;
        }

        .league-id-input button {
            padding: 6px 12px;
            font-size: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .league-id-input button:hover {
            background: #5568d3;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .table-container {
            flex: 1;
            overflow: hidden;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #tableWrapper {
            transform-origin: top left;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }

        th, td {
            padding: 8px 6px;
            text-align: center;
            border: 1px solid #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th.team-header {
            text-align: left;
            width: 1%;
            white-space: nowrap;
        }

        th.chip-header {
            width: 1%;
            white-space: nowrap;
        }

        th.player-header {
            width: auto;
        }

        td.team-name {
            text-align: left;
            font-weight: 600;
            background: #f8f9fa;
            white-space: nowrap;
            padding-left: 8px;
            padding-right: 8px;
        }

        td.chip-cell {
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            background: #fff3cd;
            color: #856404;
            white-space: nowrap;
        }

        td.chip-cell.empty {
            background: transparent;
            color: #ccc;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        .total-column {
            background: #e9ecef !important;
            font-weight: 700;
            color: #333;
        }

        .bench {
            opacity: 0.6;
            font-style: italic;
        }

        .player-cell {
            font-size: 13px;
            line-height: 1.3;
        }

        .player-name {
            display: block;
            font-weight: 500;
            font-size: 11px;
        }

        .player-points {
            display: block;
            color: #667eea;
            font-weight: 700;
            font-size: 13px;
        }

        .fixture-score {
            display: block;
            font-size: 10px;
            color: #666;
            margin-top: 2px;
            font-weight: normal;
        }

        .playing {
            background: #d4edda !important;
            border: 2px solid #28a745 !important;
        }

        .finished {
            background: #e9ecef !important;
        }

        .not-playing {
            background: #f8d7da !important;
        }

        .empty-slot {
            background: #fafafa !important;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
                width: calc(100vw - 20px);
                height: calc(100vh - 20px);
                margin: 10px;
            }

            h1 {
                font-size: 1.5em;
            }

            .subtitle {
                font-size: 0.9em;
            }

            th, td {
                padding: 6px 3px;
                font-size: 11px;
            }

            .player-cell {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="subtitle-container">
            <div class="league-id-input">
                <input type="number" id="leagueIdInput" placeholder="League ID" value="908457">
                <button onclick="loadLeague()">Load</button>
            </div>
            <span class="nav-arrow" id="prevWeek" onclick="changeGameweek(-1)">◀</span>
            <div class="subtitle" id="leagueName">
                Loading...
                <span class="last-updated" id="lastUpdated"></span>
            </div>
            <span class="nav-arrow" id="nextWeek" onclick="changeGameweek(1)">▶</span>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="table-container" id="tableContainer">
            <div id="tableWrapper">
                <table id="leagueTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Use CORS proxy for GitHub Pages hosting
        const FPL_BASE_URL = "https://fantasy.premierleague.com/api";

        // Try multiple CORS proxies in order
        const CORS_PROXIES = [
            url => url, // Try direct first (works locally)
            url => `https://raspy-glade-3e8d.q94uah8d7.workers.dev?url=${encodeURIComponent(url)}`,
        ];

        let currentProxyIndex = 0;

        // Helper function to add CORS proxy to URLs
        function proxifyUrl(url) {
            return CORS_PROXIES[currentProxyIndex](url);
        }

        // Helper to try next proxy on failure
        async function fetchWithFallback(url, options = {}) {
            for (let i = currentProxyIndex; i < CORS_PROXIES.length; i++) {
                try {
                    const proxiedUrl = CORS_PROXIES[i](url);
                    const response = await fetch(proxiedUrl, options);
                    if (response.ok) {
                        currentProxyIndex = i; // Remember working proxy
                        return response;
                    }
                } catch (error) {
                    console.log(`Proxy ${i} failed, trying next...`);
                }
            }
            throw new Error('All CORS proxies failed');
        }
        const POLL_INTERVAL = 30000; // 30 seconds
        let pollingInterval = null;
        let currentGameweek = null;
        let selectedGameweek = null;
        let totalGameweeks = 38;
        let LEAGUE_ID = 908457;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function updateNavigationArrows() {
            const prevWeek = document.getElementById('prevWeek');
            const nextWeek = document.getElementById('nextWeek');

            if (selectedGameweek <= 1) {
                prevWeek.classList.add('disabled');
            } else {
                prevWeek.classList.remove('disabled');
            }

            if (selectedGameweek >= totalGameweeks) {
                nextWeek.classList.add('disabled');
            } else {
                nextWeek.classList.remove('disabled');
            }
        }

        function changeGameweek(direction) {
            const newGameweek = selectedGameweek + direction;
            if (newGameweek >= 1 && newGameweek <= totalGameweeks) {
                selectedGameweek = newGameweek;

                // Stop auto-refresh when navigating away from current gameweek
                if (selectedGameweek !== currentGameweek && pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                } else if (selectedGameweek === currentGameweek && !pollingInterval) {
                    // Restart auto-refresh when returning to current gameweek
                    pollingInterval = setInterval(fetchLeagueData, POLL_INTERVAL);
                }

                fetchLeagueData();
            }
        }

        function loadLeague() {
            const input = document.getElementById('leagueIdInput');
            const newLeagueId = parseInt(input.value);
            if (newLeagueId && newLeagueId > 0) {
                LEAGUE_ID = newLeagueId;
                selectedGameweek = null;

                // Restart polling
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                }

                fetchLeagueData();
                pollingInterval = setInterval(fetchLeagueData, POLL_INTERVAL);
            }
        }

        async function fetchLeagueData() {
            try {
                // Get bootstrap data for current gameweek and player info
                const bootstrapResponse = await fetchWithFallback(`${FPL_BASE_URL}/bootstrap-static/`);
                const bootstrap = await bootstrapResponse.json();

                currentGameweek = bootstrap.events.find(event => event.is_current)?.id || 1;

                // Use provided gameweek or default to current
                if (!selectedGameweek) {
                    selectedGameweek = currentGameweek;
                }

                // Get total number of gameweeks and validate
                totalGameweeks = bootstrap.events.length;
                if (selectedGameweek < 1 || selectedGameweek > totalGameweeks) {
                    selectedGameweek = currentGameweek;
                }

                // Create player lookup dictionary with position info
                const playersDict = {};
                bootstrap.elements.forEach(player => {
                    playersDict[player.id] = {
                        name: player.web_name,
                        team: player.team,
                        position: player.element_type
                    };
                });

                // Create team lookup dictionary for abbreviations
                const teamsDict = {};
                bootstrap.teams.forEach(team => {
                    teamsDict[team.id] = {
                        name: team.name,
                        short_name: team.short_name
                    };
                });

                // Get live gameweek data
                const liveResponse = await fetchWithFallback(`${FPL_BASE_URL}/event/${selectedGameweek}/live/`);
                const liveData = await liveResponse.json();

                const livePoints = {};
                const playerMinutes = {};
                const playerStats = {};
                liveData.elements.forEach(element => {
                    livePoints[element.id] = element.stats.total_points;
                    playerMinutes[element.id] = element.stats.minutes;
                    playerStats[element.id] = element.stats;
                });

                // Get fixture data to determine which games are currently playing
                const fixturesResponse = await fetchWithFallback(`${FPL_BASE_URL}/fixtures/?event=${selectedGameweek}`);
                const fixtures = await fixturesResponse.json();

                // Create a set of team IDs that are currently playing (started but not finished)
                const playingTeams = new Set();
                const teamFixtures = {};
                let nextKickoff = null;

                fixtures.forEach(fixture => {
                    const teamH = fixture.team_h;
                    const teamA = fixture.team_a;

                    if (fixture.started && !fixture.finished_provisional) {
                        playingTeams.add(teamH);
                        playingTeams.add(teamA);
                    }

                    // Track next kickoff time for games that haven't started
                    if (!fixture.started && fixture.kickoff_time) {
                        const kickoffTime = fixture.kickoff_time;
                        if (nextKickoff === null || kickoffTime < nextKickoff) {
                            nextKickoff = kickoffTime;
                        }
                    }

                    // Store fixture info for each team (both home and away)
                    const fixtureInfo = {
                        team_h: teamH,
                        team_a: teamA,
                        team_h_score: fixture.team_h_score,
                        team_a_score: fixture.team_a_score,
                        started: fixture.started,
                        finished: fixture.finished_provisional,
                        minutes: fixture.minutes || 0
                    };
                    teamFixtures[teamH] = fixtureInfo;
                    teamFixtures[teamA] = fixtureInfo;
                });

                // Get league standings
                const leagueResponse = await fetchWithFallback(`${FPL_BASE_URL}/leagues-classic/${LEAGUE_ID}/standings/`);
                const leagueData = await leagueResponse.json();

                // Build team data
                const teamsData = [];
                for (const standing of leagueData.standings.results) {
                    const entryId = standing.entry;
                    const teamName = standing.entry_name;
                    const playerName = standing.player_name;

                    // Get team picks
                    try {
                        const picksResponse = await fetchWithFallback(`${FPL_BASE_URL}/entry/${entryId}/event/${selectedGameweek}/picks/`);
                        const picksData = await picksResponse.json();
                        const activeChip = picksData.active_chip;

                        let totalPoints = 0;
                        const players = [];

                        // Sort picks: positions 1-11 first, then 13-15, then 12 (bench GK last)
                        const sortedPicks = picksData.picks.sort((a, b) => {
                            const posA = a.position <= 11 ? a.position : (a.position === 12 ? 15 : a.position - 1);
                            const posB = b.position <= 11 ? b.position : (b.position === 12 ? 15 : b.position - 1);
                            return posA - posB;
                        });

                        sortedPicks.forEach(pick => {
                            const playerId = pick.element;
                            const playerInfo = playersDict[playerId] || { name: "Unknown", team: 0, position: 0 };
                            const points = livePoints[playerId] || 0;
                            const playerTeamId = playerInfo.team;

                            const multiplier = pick.multiplier;
                            const actualPoints = points * multiplier;
                            totalPoints += actualPoints;

                            const isPlaying = playingTeams.has(playerTeamId);

                            // Check if player's game started and they didn't play
                            const minutesPlayed = playerMinutes[playerId] || 0;
                            const gameStarted = teamFixtures[playerTeamId]?.started || false;
                            const isNotPlaying = gameStarted && minutesPlayed === 0;

                            // Get fixture score info for this player's team
                            let fixtureScore = null;
                            if (teamFixtures[playerTeamId]) {
                                const fixture = teamFixtures[playerTeamId];
                                fixtureScore = {
                                    team_h: teamsDict[fixture.team_h].short_name,
                                    team_a: teamsDict[fixture.team_a].short_name,
                                    team_h_score: fixture.team_h_score,
                                    team_a_score: fixture.team_a_score,
                                    minutes: fixture.minutes,
                                    finished: fixture.finished,
                                    started: fixture.started,
                                    player_team: teamsDict[playerTeamId].short_name
                                };
                            }

                            players.push({
                                name: playerInfo.name,
                                player_id: playerId,
                                points: points,
                                actual_points: actualPoints,
                                multiplier: multiplier,
                                position: pick.position,
                                position_type: playerInfo.position,
                                is_playing: isPlaying,
                                is_not_playing: isNotPlaying,
                                fixture_score: fixtureScore,
                                stats: playerStats[playerId] || {}
                            });
                        });

                        teamsData.push({
                            team_name: teamName,
                            player_name: playerName,
                            players: players,
                            total_points: totalPoints,
                            active_chip: activeChip
                        });
                    } catch (error) {
                        console.error(`Failed to fetch picks for entry ${entryId}:`, error);
                        // Skip this team if we can't get their picks
                    }
                }

                // Sort by total points descending
                teamsData.sort((a, b) => b.total_points - a.total_points);

                const data = {
                    gameweek: selectedGameweek,
                    current_gameweek: currentGameweek,
                    total_gameweeks: totalGameweeks,
                    teams: teamsData,
                    league_name: leagueData.league.name
                };

                renderTable(data);

                const now = new Date().toLocaleTimeString();
                const gwLabel = selectedGameweek === currentGameweek
                    ? `Gameweek ${data.gameweek}`
                    : `Gameweek ${data.gameweek} (Historical)`;

                document.getElementById('leagueName').innerHTML =
                    `${data.league_name} - ${gwLabel} <span class="last-updated">Last updated: ${now}</span>`;

                updateNavigationArrows();
                hideStatus();
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error('Error fetching league data:', error);
            }
        }

        function scaleTableToFit() {
            const container = document.getElementById('tableContainer');
            const wrapper = document.getElementById('tableWrapper');
            const table = document.getElementById('leagueTable');

            // Reset scale to measure natural size
            wrapper.style.transform = 'scale(1)';

            // Get dimensions
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const tableWidth = table.offsetWidth;
            const tableHeight = table.offsetHeight;

            // Calculate scale factors
            const scaleX = containerWidth / tableWidth;
            const scaleY = containerHeight / tableHeight;
            const scale = Math.min(scaleX, scaleY);

            // Allow scaling up to 3x for better readability on large screens
            const finalScale = Math.min(scale, 3);

            // Apply scale
            wrapper.style.transform = `scale(${finalScale})`;
            wrapper.style.width = `${100 / finalScale}%`;
            wrapper.style.height = `${100 / finalScale}%`;
        }

        function renderTable(data) {
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');

            // Clear existing content
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            if (!data.teams || data.teams.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100%">No data available</td></tr>';
                return;
            }

            // Create header row with GK, P2-P11, B1-B3, B GK labels
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = '<th class="team-header">Team</th><th class="chip-header">Chip</th>';

            // Add starting XI headers (GK, P2 - P11)
            for (let i = 1; i <= 11; i++) {
                const th = document.createElement('th');
                th.className = 'player-header';
                if (i === 1) {
                    th.textContent = 'GK';
                    th.title = 'Goalkeeper';
                } else {
                    th.textContent = `P${i}`;
                    th.title = `Player ${i}`;
                }
                headerRow.appendChild(th);
            }

            // Add bench headers (B1, B2, B3, B GK)
            for (let i = 1; i <= 4; i++) {
                const th = document.createElement('th');
                th.className = 'player-header';
                if (i === 4) {
                    th.textContent = 'B GK';
                    th.title = 'Bench Goalkeeper';
                } else {
                    th.textContent = `B${i}`;
                    th.title = `Bench ${i}`;
                }
                headerRow.appendChild(th);
            }

            headerRow.innerHTML += '<th class="total-column">Total</th>';
            tableHead.appendChild(headerRow);

            // Create data rows
            data.teams.forEach((team, index) => {
                const row = document.createElement('tr');

                // Calculate player status counts (only starting XI, not bench)
                let awaitCount = 0;
                let playingCount = 0;
                let doneCount = 0;

                team.players.slice(0, 11).forEach(player => {
                    if (player.fixture_score) {
                        if (!player.fixture_score.started) {
                            awaitCount++;
                        } else if (!player.fixture_score.finished) {
                            playingCount++;
                        } else {
                            doneCount++;
                        }
                    }
                });

                // Team name cell
                const teamCell = document.createElement('td');
                teamCell.className = 'team-name';
                const statusText = `<span style="font-size: 9px; color: #999;">${awaitCount} AWAIT / ${playingCount} PLAYING / ${doneCount} DONE</span>`;
                teamCell.innerHTML = `<strong>${team.team_name}</strong><br><small>${team.player_name}</small><br>${statusText}`;
                row.appendChild(teamCell);

                // Chip cell
                const chipCell = document.createElement('td');
                if (team.active_chip) {
                    chipCell.className = 'chip-cell';
                    // Format chip name
                    let chipDisplay = team.active_chip;
                    if (chipDisplay === '3xc') chipDisplay = '3xC';
                    else if (chipDisplay === 'bboost') chipDisplay = 'BB';
                    else if (chipDisplay === 'freehit') chipDisplay = 'FH';
                    else if (chipDisplay === 'wildcard') chipDisplay = 'WC';
                    chipCell.textContent = chipDisplay;
                    chipCell.title = `Active Chip: ${team.active_chip}`;
                } else {
                    chipCell.className = 'chip-cell empty';
                    chipCell.textContent = '-';
                }
                row.appendChild(chipCell);

                // Player cells
                team.players.forEach((player, idx) => {
                    const cell = document.createElement('td');
                    cell.className = 'player-cell';

                    if (player.position > 11) {
                        cell.classList.add('bench');
                    }

                    // Add not-playing class if player's game started but they didn't play
                    if (player.is_not_playing) {
                        cell.classList.add('not-playing');
                    }
                    // Add playing class if player's game is currently live
                    else if (player.is_playing) {
                        cell.classList.add('playing');
                    }
                    // Add finished class if player's game is finished
                    else if (player.fixture_score && player.fixture_score.finished) {
                        cell.classList.add('finished');
                    }

                    // Build detailed title with all stats
                    let title = player.name;
                    if (player.multiplier === 2) {
                        title += ' (C)';
                    } else if (player.multiplier === 3) {
                        title += ' (TC)';
                    }
                    title += `\nTotal Points: ${player.points}`;

                    if (player.stats) {
                        const s = player.stats;
                        title += `\n\nMinutes: ${s.minutes || 0}`;
                        title += `\nGoals: ${s.goals_scored || 0}`;
                        title += `\nAssists: ${s.assists || 0}`;
                        title += `\nClean Sheets: ${s.clean_sheets || 0}`;
                        title += `\nGoals Conceded: ${s.goals_conceded || 0}`;
                        title += `\nOwn Goals: ${s.own_goals || 0}`;
                        title += `\nPenalties Saved: ${s.penalties_saved || 0}`;
                        title += `\nPenalties Missed: ${s.penalties_missed || 0}`;
                        title += `\nYellow Cards: ${s.yellow_cards || 0}`;
                        title += `\nRed Cards: ${s.red_cards || 0}`;
                        title += `\nSaves: ${s.saves || 0}`;
                        title += `\nBonus: ${s.bonus || 0}`;
                        title += `\nBPS: ${s.bps || 0}`;
                    }

                    cell.title = title;

                    const pointsText = player.multiplier > 1
                        ? `${player.actual_points} (${player.points}×${player.multiplier})`
                        : player.points;

                    let fixtureScoreHtml = '';
                    if (player.fixture_score) {
                        const fs = player.fixture_score;
                        const teamH = fs.player_team === fs.team_h
                            ? `<strong>${fs.team_h}</strong>`
                            : fs.team_h;
                        const teamA = fs.player_team === fs.team_a
                            ? `<strong>${fs.team_a}</strong>`
                            : fs.team_a;

                        if (!fs.started) {
                            // Game hasn't started yet - show "vs"
                            fixtureScoreHtml = `<span class="fixture-score">${teamH} vs ${teamA}</span>`;
                        } else if (fs.finished) {
                            // Game is finished - show score without time
                            fixtureScoreHtml = `<span class="fixture-score">${teamH} ${fs.team_h_score}-${fs.team_a_score} ${teamA}</span>`;
                        } else {
                            // Game is in progress - show score with time
                            fixtureScoreHtml = `<span class="fixture-score">${teamH} ${fs.team_h_score}-${fs.team_a_score} ${teamA} (${fs.minutes}')</span>`;
                        }
                    }

                    cell.innerHTML = `
                        <span class="player-name">${player.name}</span>
                        <span class="player-points">${pointsText}</span>
                        ${fixtureScoreHtml}
                    `;
                    row.appendChild(cell);
                });

                // Total points cell
                const totalCell = document.createElement('td');
                totalCell.className = 'total-column';
                totalCell.textContent = team.total_points;
                row.appendChild(totalCell);

                tableBody.appendChild(row);
            });

            // Scale table to fit container after rendering
            setTimeout(() => scaleTableToFit(), 0);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changeGameweek(-1);
            } else if (e.key === 'ArrowRight') {
                changeGameweek(1);
            }
        });

        // Handle window/viewport size changes with debounce for performance
        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                scaleTableToFit();
            }, 100);
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        // Also trigger on zoom/fullscreen changes
        window.visualViewport?.addEventListener('resize', handleResize);

        // Start auto-refresh on page load
        window.addEventListener('DOMContentLoaded', () => {
            fetchLeagueData(); // Load immediately
            pollingInterval = setInterval(fetchLeagueData, POLL_INTERVAL); // Then poll every interval
        });
    </script>
</body>
</html>
