<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FPL Live League Points</title>
    <link rel="manifest" href="data:application/json;base64,eyJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsIm9yaWVudGF0aW9uIjoibGFuZHNjYXBlIn0=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: calc(100vw - 20px);
            height: calc(100vh - 20px);
            margin: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 4px;
            font-size: 1.8em;
        }

        .subtitle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            gap: 10px;
            flex-shrink: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95em;
        }

        .nav-arrow {
            cursor: pointer;
            font-size: 24px;
            color: #667eea;
            user-select: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .nav-arrow:hover {
            background: #f0f0f0;
        }

        .nav-arrow.disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .nav-arrow.disabled:hover {
            background: transparent;
        }

        .last-updated {
            color: #999;
            font-size: 0.75em;
            font-weight: normal;
            margin-left: 10px;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .table-container {
            flex: 1;
            overflow: hidden;
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #tableWrapper {
            transform-origin: top left;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        th, td {
            padding: 4px 4px;
            text-align: center;
            border: 1px solid #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            background: #7c92f0;
        }

        th.sorted {
            background: #4c5fcf;
        }

        th.team-header {
            text-align: left;
            width: 1%;
            white-space: nowrap;
        }

        th.chip-header {
            width: 1%;
            white-space: nowrap;
        }

        th.player-header {
            width: auto;
        }

        td.team-name {
            text-align: left;
            font-weight: 600;
            background: #f8f9fa;
            white-space: nowrap;
            padding-left: 4px;
            padding-right: 4px;
        }

        td.chip-cell {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            background: #fff3cd;
            color: #856404;
            white-space: nowrap;
        }

        td.chip-cell.empty {
            background: transparent;
            color: #ccc;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        .total-column {
            background: #e9ecef !important;
            font-weight: 700;
            color: #333;
        }

        .bench {
            opacity: 0.6;
            font-style: italic;
        }

        .player-cell {
            font-size: 15px;
            line-height: 1.2;
        }

        .player-name {
            display: block;
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 1px;
        }

        .player-points {
            display: block;
            color: #667eea;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 1px;
        }

        .fixture-score {
            display: block;
            font-size: 11px;
            color: #666;
            margin-top: 0;
            font-weight: normal;
        }

        .playing {
            background: #d4edda !important;
            border: 2px solid #28a745 !important;
        }

        .finished {
            background: #e9ecef !important;
        }

        .not-playing {
            background: #f8d7da !important;
        }

        .empty-slot {
            background: #fafafa !important;
            opacity: 0.3;
        }

        @media (max-width: 768px), (max-height: 768px) {
            /* Remove purple background on mobile */
            body {
                background: white;
            }

            .container {
                padding: 0;
                width: 100vw;
                height: 100vh;
                margin: 0;
                box-shadow: none;
                border-radius: 0;
            }

            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            /* Hide the entire subtitle container (league name + arrows) on mobile */
            .subtitle-container {
                display: none !important;
            }

            /* Hide last updated time on mobile */
            .last-updated {
                display: none;
            }

            table {
                font-size: 20px;
            }

            th, td {
                padding: 10px 6px;
                font-size: 16px;
            }

            td.team-name {
                font-size: 18px;
                font-weight: 700;
            }

            td.chip-cell {
                font-size: 16px;
            }

            .player-cell {
                font-size: 16px;
                line-height: 1.4;
            }

            .player-name {
                font-size: 14px;
                font-weight: 600;
            }

            .player-points {
                font-size: 18px;
                font-weight: 700;
            }

            .total-column {
                font-size: 20px;
                font-weight: 800;
            }

            /* Hide fixture scores on mobile */
            .fixture-score {
                display: none !important;
            }

            /* Simplify team name cell - hide player manager name and status */
            .mobile-hide {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="subtitle-container">
            <span class="nav-arrow" id="prevWeek" onclick="changeGameweek(-1)">◀</span>
            <div class="subtitle" id="leagueName">
                Loading...
                <span class="last-updated" id="lastUpdated"></span>
            </div>
            <span class="nav-arrow" id="nextWeek" onclick="changeGameweek(1)">▶</span>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="table-container" id="tableContainer">
            <div id="tableWrapper">
                <table id="leagueTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Use CORS proxy for GitHub Pages hosting
        const FPL_BASE_URL = "https://fantasy.premierleague.com/api";

        // Helper function to add CORS proxy to URLs
        function proxifyUrl(url) {
            return `https://raspy-glade-3e8d.q94uah8d7.workers.dev?url=${encodeURIComponent(url)}`
        }

        // Helper to try next proxy on failure
        async function fetchWithFallback(url, options = {}) {
            const proxiedUrl = proxifyUrl(url);
            try {
                const response = await fetch(proxiedUrl, options);
                if (response.ok) {
                    return response;
                }
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            } catch (error) {
                throw error;
            }
        }

        const POLL_INTERVAL = 30000; // 30 seconds
        let pollingInterval = null;
        let currentGameweek = null;
        let selectedGameweek = null;
        let totalGameweeks = 38;
        let currentSortColumn = 'gw';
        let currentSortDirection = 'desc';
        let cachedTeamsData = null;

        const POSITION_COLUMNS = {
            DEF: [1, 2, 3, 4, 5],    // max 5
            MID: [6, 7, 8, 9, 10],   // max 5
            FWD: [11, 12, 13]        // logical, but mapped to 9–10 later
        };

        // Get league ID and gameweek from URL query parameters
        const urlParams = new URLSearchParams(window.location.search);
        let LEAGUE_ID = parseInt(urlParams.get('league')) || 908457;
        const INITIAL_GAMEWEEK = urlParams.get('gw') ? parseInt(urlParams.get('gw')) : null;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function updateNavigationArrows() {
            const prevWeek = document.getElementById('prevWeek');
            const nextWeek = document.getElementById('nextWeek');

            if (selectedGameweek <= 1) {
                prevWeek.classList.add('disabled');
            } else {
                prevWeek.classList.remove('disabled');
            }

            if (selectedGameweek >= totalGameweeks) {
                nextWeek.classList.add('disabled');
            } else {
                nextWeek.classList.remove('disabled');
            }
        }

        function changeGameweek(direction) {
            const newGameweek = selectedGameweek + direction;
            if (newGameweek >= 1 && newGameweek <= totalGameweeks) {
                selectedGameweek = newGameweek;

                // Update URL with new gameweek
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('gw', selectedGameweek);
                window.history.pushState({}, '', newUrl);

                // Stop auto-refresh when navigating away from current gameweek
                if (selectedGameweek !== currentGameweek && pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                } else if (selectedGameweek === currentGameweek && !pollingInterval) {
                    // Restart auto-refresh when returning to current gameweek
                    pollingInterval = setInterval(fetchLeagueData, POLL_INTERVAL);
                }

                fetchLeagueData();
            }
        }

        function buildPlayerFrequency(teams) {
            const freq = new Map();

            teams.forEach(team => {
                team.players.slice(1, 11).forEach(p => {
                    if (!freq.has(p.player_id)) {
                        freq.set(p.player_id, {
                            count: 0,
                            name: p.name,
                            position_type: p.position_type
                        });
                    }
                    freq.get(p.player_id).count++;
                });
            });

            // sort by frequency (descending)
            return new Map(
                [...freq.entries()].sort((a, b) => b[1].count - a[1].count)
            );
        }

        function commonPlayerColumns(freqMap) {
            const DEF = [];
            const MID = [];
            const FWD = [];

            for (const [id, meta] of freqMap.entries()) {
                const entry = { id, ...meta };
                if (meta.position_type === 2) DEF.push(entry);
                if (meta.position_type === 3) MID.push(entry);
                if (meta.position_type === 4) FWD.push(entry);
            }

            DEF.sort((a, b) => b.count - a.count);
            MID.sort((a, b) => b.count - a.count);
            FWD.sort((a, b) => b.count - a.count);

            const layout = Array(11).fill(null);

            // Defenders
            layout[1] = DEF[0].id ?? null;
            layout[2] = DEF[1].id ?? null;
            layout[3] = DEF[2].id ?? null;

            // Midfielders
            layout[6] = MID[0].id ?? null;
            layout[7] = MID[1].id ?? null;

            // Forwards
            layout[10] = FWD[0].id ?? null;

            return layout;
        }

        function mapTeamToColumns(team, columnLayout) {
            const slots = Array(15).fill(null);

            // GK always zero
            slots[0] = team.players[0];

            // loop over players and fill them in if most common
            for (let i = 1; i < 11; i++) {
                const player = team.players[i];

                let index = columnLayout.indexOf(player.player_id);

                // plus 1 to account for GK
                if (index != -1) {
                    slots[index] = player;
                }
            }

            // loop again and fill in blanks
            for (let i = 1; i < 11; i++) {
                const player = team.players[i];

                // skip if already accounted for
                if (slots.some(p => p?.player_id === player.player_id)) {
                    continue
                }

                // next blank
                index = slots.indexOf(null, 1);
                slots[index] = player;
            }

            // Bench always at end
            for (let i = 11; i < 15; i++) {
                slots[i] = team.players[i];
            }

            return slots;
        }

        async function fetchLeagueData() {
            try {
                // Get bootstrap data for current gameweek and player info
                const bootstrapResponse = await fetchWithFallback(`${FPL_BASE_URL}/bootstrap-static/`);
                const bootstrap = await bootstrapResponse.json();

                currentGameweek = bootstrap.events.find(event => event.is_current)?.id || 1;

                // Use provided gameweek or default to current
                if (!selectedGameweek) {
                    selectedGameweek = INITIAL_GAMEWEEK !== null ? INITIAL_GAMEWEEK : currentGameweek;
                }

                // Get total number of gameweeks and validate
                totalGameweeks = bootstrap.events.length;
                if (selectedGameweek < 1 || selectedGameweek > totalGameweeks) {
                    selectedGameweek = currentGameweek;
                }

                // Create player lookup dictionary with position info
                const playersDict = {};
                bootstrap.elements.forEach(player => {
                    playersDict[player.id] = {
                        name: player.web_name,
                        team: player.team,
                        position: player.element_type,
                        total_points: player.total_points
                    };
                });

                // Create team lookup dictionary for abbreviations
                const teamsDict = {};
                bootstrap.teams.forEach(team => {
                    teamsDict[team.id] = {
                        name: team.name,
                        short_name: team.short_name
                    };
                });

                // Get live gameweek data
                const liveResponse = await fetchWithFallback(`${FPL_BASE_URL}/event/${selectedGameweek}/live/`);
                const liveData = await liveResponse.json();

                const livePoints = {};
                const playerMinutes = {};
                const playerStats = {};
                liveData.elements.forEach(element => {
                    livePoints[element.id] = element.stats.total_points;
                    playerMinutes[element.id] = element.stats.minutes;
                    playerStats[element.id] = element.stats;
                });

                // Get fixture data to determine which games are currently playing
                const fixturesResponse = await fetchWithFallback(`${FPL_BASE_URL}/fixtures/?event=${selectedGameweek}`);
                const fixtures = await fixturesResponse.json();

                // Create a set of team IDs that are currently playing (started but not finished)
                const playingTeams = new Set();
                const teamFixtures = {};
                let nextKickoff = null;

                fixtures.forEach(fixture => {
                    const teamH = fixture.team_h;
                    const teamA = fixture.team_a;

                    if (fixture.started && !fixture.finished_provisional) {
                        playingTeams.add(teamH);
                        playingTeams.add(teamA);
                    }

                    // Track next kickoff time for games that haven't started
                    if (!fixture.started && fixture.kickoff_time) {
                        const kickoffTime = fixture.kickoff_time;
                        if (nextKickoff === null || kickoffTime < nextKickoff) {
                            nextKickoff = kickoffTime;
                        }
                    }

                    // Store fixture info for each team (both home and away)
                    const fixtureInfo = {
                        team_h: teamH,
                        team_a: teamA,
                        team_h_score: fixture.team_h_score,
                        team_a_score: fixture.team_a_score,
                        started: fixture.started,
                        finished: fixture.finished_provisional,
                        minutes: fixture.minutes || 0
                    };
                    teamFixtures[teamH] = fixtureInfo;
                    teamFixtures[teamA] = fixtureInfo;
                });

                // Get league standings
                const leagueResponse = await fetchWithFallback(`${FPL_BASE_URL}/leagues-classic/${LEAGUE_ID}/standings/`);
                const leagueData = await leagueResponse.json();

                // Build team data
                const teamsData = [];
                for (const standing of leagueData.standings.results) {
                    const entryId = standing.entry;
                    const teamName = standing.entry_name;
                    const playerName = standing.player_name;
                    const managerSeasonTotal = standing.total;

                    // Get team picks
                    try {
                        const picksResponse = await fetchWithFallback(`${FPL_BASE_URL}/entry/${entryId}/event/${selectedGameweek}/picks/`);
                        const picksData = await picksResponse.json();
                        const activeChip = picksData.active_chip;

                        let totalPoints = 0;
                        const players = [];

                        // Sort picks: positions 1-11 first, then 13-15, then 12 (bench GK last)
                        const sortedPicks = picksData.picks.sort((a, b) => {
                            const posA = a.position <= 11 ? a.position : (a.position === 12 ? 15 : a.position - 1);
                            const posB = b.position <= 11 ? b.position : (b.position === 12 ? 15 : b.position - 1);
                            return posA - posB;
                        });

                        sortedPicks.forEach(pick => {
                            const playerId = pick.element;
                            const playerInfo = playersDict[playerId] || { name: "Unknown", team: 0, position: 0, total_points: 0 };
                            const points = livePoints[playerId] || 0;
                            const playerTeamId = playerInfo.team;

                            const multiplier = pick.multiplier;
                            const actualPoints = points * multiplier;
                            totalPoints += actualPoints;

                            const isPlaying = playingTeams.has(playerTeamId);

                            // Check if player's game started and they didn't play
                            const minutesPlayed = playerMinutes[playerId] || 0;
                            const gameStarted = teamFixtures[playerTeamId]?.started || false;
                            const isNotPlaying = gameStarted && minutesPlayed === 0;

                            // Get fixture score info for this player's team
                            let fixtureScore = null;
                            if (teamFixtures[playerTeamId]) {
                                const fixture = teamFixtures[playerTeamId];
                                fixtureScore = {
                                    team_h: teamsDict[fixture.team_h].short_name,
                                    team_a: teamsDict[fixture.team_a].short_name,
                                    team_h_score: fixture.team_h_score,
                                    team_a_score: fixture.team_a_score,
                                    minutes: fixture.minutes,
                                    finished: fixture.finished,
                                    started: fixture.started,
                                    player_team: teamsDict[playerTeamId].short_name
                                };
                            }

                            players.push({
                                name: playerInfo.name,
                                player_id: playerId,
                                points: points,
                                actual_points: actualPoints,
                                multiplier: multiplier,
                                position: pick.position,
                                position_type: playerInfo.position,
                                is_playing: isPlaying,
                                is_not_playing: isNotPlaying,
                                fixture_score: fixtureScore,
                                stats: playerStats[playerId] || {}
                            });
                        });

                        teamsData.push({
                            team_name: teamName,
                            player_name: playerName,
                            players: players,
                            total_points: totalPoints,
                            total_season_points: managerSeasonTotal + totalPoints,
                            active_chip: activeChip
                        });
                    } catch (error) {
                        console.error(`Failed to fetch picks for entry ${entryId}:`, error);
                        // Skip this team if we can't get their picks
                    }
                }

                // Cache the teams data for re-sorting
                cachedTeamsData = teamsData;

                const data = {
                    gameweek: selectedGameweek,
                    current_gameweek: currentGameweek,
                    total_gameweeks: totalGameweeks,
                    teams: sortTeams(teamsData, currentSortColumn, currentSortDirection),
                    league_name: leagueData.league.name
                };

                renderTable(data);

                const now = new Date().toLocaleTimeString();
                const gwLabel = selectedGameweek === currentGameweek
                    ? `Gameweek ${data.gameweek}`
                    : `Gameweek ${data.gameweek} (Historical)`;

                document.getElementById('leagueName').innerHTML =
                    `${data.league_name} - ${gwLabel} <span class="last-updated">Last updated: ${now}</span>`;

                updateNavigationArrows();
                hideStatus();
            } catch (error) {
                // Just log errors to console, don't show to user
                console.error('Error fetching league data:', error);
                hideStatus();
            }
        }

        function sortTeams(teams, column, direction) {
            const sorted = [...teams].sort((a, b) => {
                let aVal, bVal;

                if (column === 'gw') {
                    aVal = a.total_points;
                    bVal = b.total_points;
                } else if (column === 'avg') {
                    // Calculate playing count for each team
                    let aPlaying = 0, bPlaying = 0;
                    a.players.slice(0, 11).forEach(player => {
                        if (player.fixture_score) {
                            if (player.fixture_score.started) {
                                aPlaying++;
                            }
                        }
                    });
                    b.players.slice(0, 11).forEach(player => {
                        if (player.fixture_score) {
                            if (player.fixture_score.started) {
                                bPlaying++;
                            }
                        }
                    });

                    aVal = aPlaying > 0 ? a.total_points / aPlaying : 0;
                    bVal = bPlaying > 0 ? b.total_points / bPlaying : 0;
                } else if (column === 'season') {
                    aVal = a.total_season_points;
                    bVal = b.total_season_points;
                }

                if (direction === 'desc') {
                    return bVal - aVal;
                } else {
                    return aVal - bVal;
                }
            });

            return sorted;
        }

        function handleSort(column) {
            // Toggle direction if clicking the same column, otherwise default to desc
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'desc' ? 'asc' : 'desc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'desc';
            }

            // Re-render with sorted data
            if (cachedTeamsData) {
                const data = {
                    gameweek: selectedGameweek,
                    current_gameweek: currentGameweek,
                    total_gameweeks: totalGameweeks,
                    teams: sortTeams(cachedTeamsData, currentSortColumn, currentSortDirection),
                    league_name: document.getElementById('leagueName').textContent.split(' - ')[0]
                };
                renderTable(data);
            }
        }

        function scaleTableToFit() {
            const container = document.getElementById('tableContainer');
            const wrapper = document.getElementById('tableWrapper');
            const table = document.getElementById('leagueTable');

            // Reset scale to measure natural size
            wrapper.style.transform = 'scale(1)';

            // Get dimensions
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const tableWidth = table.offsetWidth;
            const tableHeight = table.offsetHeight;

            // Calculate scale factors
            const scaleX = containerWidth / tableWidth;
            const scaleY = containerHeight / tableHeight;
            const scale = Math.min(scaleX, scaleY);

            // Allow unlimited scaling for maximum text size
            const finalScale = scale;

            // Apply scale
            wrapper.style.transform = `scale(${finalScale})`;
            wrapper.style.width = `${100 / finalScale}%`;
            wrapper.style.height = `${100 / finalScale}%`;
        }

        function renderTable(data) {
            const freqMap = buildPlayerFrequency(data.teams);
            const columnLayout = commonPlayerColumns(freqMap);

            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');

            // Clear existing content
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            if (!data.teams || data.teams.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100%">No data available</td></tr>';
                return;
            }

            // Create header row with GK, P2-P11, B1-B3, B GK labels
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = '<th class="team-header">Team</th><th class="chip-header">Chip</th>';

            // Add starting XI headers (GK, P2 - P11)
            for (let i = 1; i <= 11; i++) {
                const th = document.createElement('th');
                th.className = 'player-header';
                if (i === 1) {
                    th.textContent = 'GK';
                    th.title = 'Goalkeeper';
                } else {
                    th.textContent = `P${i}`;
                    th.title = `Player ${i}`;
                }
                headerRow.appendChild(th);
            }

            // Add bench headers (B1, B2, B3, B GK)
            for (let i = 1; i <= 4; i++) {
                const th = document.createElement('th');
                th.className = 'player-header';
                if (i === 4) {
                    th.textContent = 'B GK';
                    th.title = 'Bench Goalkeeper';
                } else {
                    th.textContent = `B${i}`;
                    th.title = `Bench ${i}`;
                }
                headerRow.appendChild(th);
            }

            // Add sortable column headers
            const gwHeader = document.createElement('th');
            gwHeader.className = 'total-column sortable' + (currentSortColumn === 'gw' ? ' sorted' : '');
            gwHeader.textContent = 'GW' + (currentSortColumn === 'gw' ? (currentSortDirection === 'desc' ? ' ↓' : ' ↑') : '');
            gwHeader.title = 'Gameweek total points';
            gwHeader.onclick = () => handleSort('gw');
            headerRow.appendChild(gwHeader);

            const avgHeader = document.createElement('th');
            avgHeader.className = 'total-column sortable' + (currentSortColumn === 'avg' ? ' sorted' : '');
            avgHeader.textContent = 'Avg' + (currentSortColumn === 'avg' ? (currentSortDirection === 'desc' ? ' ↓' : ' ↑') : '');
            avgHeader.title = 'Average points per player (only Playing + Done)';
            avgHeader.onclick = () => handleSort('avg');
            headerRow.appendChild(avgHeader);

            const seasonHeader = document.createElement('th');
            seasonHeader.className = 'total-column sortable' + (currentSortColumn === 'season' ? ' sorted' : '');
            seasonHeader.textContent = 'Season' + (currentSortColumn === 'season' ? (currentSortDirection === 'desc' ? ' ↓' : ' ↑') : '');
            seasonHeader.title = 'Total season points';
            seasonHeader.onclick = () => handleSort('season');
            headerRow.appendChild(seasonHeader);

            tableHead.appendChild(headerRow);

            // Create data rows
            data.teams.forEach((team, index) => {
                const row = document.createElement('tr');

                // Calculate player status counts (only starting XI, not bench)
                let awaitCount = 0;
                let playingCount = 0;
                let doneCount = 0;

                team.players.slice(0, 11).forEach(player => {
                    if (player.fixture_score) {
                        if (!player.fixture_score.started) {
                            awaitCount++;
                        } else if (!player.fixture_score.finished) {
                            playingCount++;
                        } else {
                            doneCount++;
                        }
                    }
                });

                // Team name cell
                const teamCell = document.createElement('td');
                teamCell.className = 'team-name';
                const statusText = `<span class="mobile-hide" style="font-size: 9px; color: #999;">${awaitCount} AWAIT / ${playingCount} PLAYING / ${doneCount} DONE</span>`;
                teamCell.innerHTML = `<strong>${team.team_name}</strong><br><small class="mobile-hide">${team.player_name}</small><br>${statusText}`;
                row.appendChild(teamCell);

                // Chip cell
                const chipCell = document.createElement('td');
                if (team.active_chip) {
                    chipCell.className = 'chip-cell';
                    // Format chip name
                    let chipDisplay = team.active_chip;
                    if (chipDisplay === '3xc') chipDisplay = '3xC';
                    else if (chipDisplay === 'bboost') chipDisplay = 'BB';
                    else if (chipDisplay === 'freehit') chipDisplay = 'FH';
                    else if (chipDisplay === 'wildcard') chipDisplay = 'WC';
                    chipCell.textContent = chipDisplay;
                    chipCell.title = `Active Chip: ${team.active_chip}`;
                } else {
                    chipCell.className = 'chip-cell empty';
                    chipCell.textContent = '-';
                }
                row.appendChild(chipCell);

                const orderedPlayers = mapTeamToColumns(team, columnLayout);

                // Player cells
                orderedPlayers.forEach((player, idx) => {
                    const cell = document.createElement('td');
                    cell.className = 'player-cell';

                    if (!player) {
                        cell.classList.add('empty-slot');
                        row.appendChild(cell);
                        return;
                    }

                    if (player.position > 11) {
                        cell.classList.add('bench');
                    }

                    // Add not-playing class if player's game started but they didn't play
                    if (player.is_not_playing) {
                        cell.classList.add('not-playing');
                    }
                    // Add playing class if player's game is currently live
                    else if (player.is_playing) {
                        cell.classList.add('playing');
                    }
                    // Add finished class if player's game is finished
                    else if (player.fixture_score && player.fixture_score.finished) {
                        cell.classList.add('finished');
                    }

                    // Build detailed title with all stats
                    let title = player.name;
                    if (player.multiplier === 2) {
                        title += ' (C)';
                    } else if (player.multiplier === 3) {
                        title += ' (TC)';
                    }
                    title += `\nTotal Points: ${player.points}`;

                    if (player.stats) {
                        const s = player.stats;
                        title += `\n\nMinutes: ${s.minutes || 0}`;
                        title += `\nGoals: ${s.goals_scored || 0}`;
                        title += `\nAssists: ${s.assists || 0}`;
                        title += `\nClean Sheets: ${s.clean_sheets || 0}`;
                        title += `\nGoals Conceded: ${s.goals_conceded || 0}`;
                        title += `\nOwn Goals: ${s.own_goals || 0}`;
                        title += `\nPenalties Saved: ${s.penalties_saved || 0}`;
                        title += `\nPenalties Missed: ${s.penalties_missed || 0}`;
                        title += `\nYellow Cards: ${s.yellow_cards || 0}`;
                        title += `\nRed Cards: ${s.red_cards || 0}`;
                        title += `\nSaves: ${s.saves || 0}`;
                        title += `\nBonus: ${s.bonus || 0}`;
                        title += `\nBPS: ${s.bps || 0}`;
                    }

                    cell.title = title;

                    const pointsText = player.multiplier > 1
                        ? `${player.actual_points} (${player.points}×${player.multiplier})`
                        : player.points;

                    let fixtureScoreHtml = '';
                    if (player.fixture_score) {
                        const fs = player.fixture_score;
                        const teamH = fs.player_team === fs.team_h
                            ? `<strong>${fs.team_h}</strong>`
                            : fs.team_h;
                        const teamA = fs.player_team === fs.team_a
                            ? `<strong>${fs.team_a}</strong>`
                            : fs.team_a;

                        if (!fs.started) {
                            // Game hasn't started yet - show "vs"
                            fixtureScoreHtml = `<span class="fixture-score">${teamH} vs ${teamA}</span>`;
                        } else if (fs.finished) {
                            // Game is finished - show score without time
                            fixtureScoreHtml = `<span class="fixture-score">${teamH} ${fs.team_h_score}-${fs.team_a_score} ${teamA}</span>`;
                        } else {
                            // Game is in progress - show score with time
                            fixtureScoreHtml = `<span class="fixture-score">${teamH} ${fs.team_h_score}-${fs.team_a_score} ${teamA} (${fs.minutes}')</span>`;
                        }
                    }

                    cell.innerHTML = `
                        <span class="player-name">${player.name}</span>
                        <span class="player-points">${pointsText}</span>
                        ${fixtureScoreHtml}
                    `;
                    row.appendChild(cell);
                });

                // Total points cell
                const totalCell = document.createElement('td');
                totalCell.className = 'total-column';
                totalCell.textContent = team.total_points;
                row.appendChild(totalCell);

                // Points per player cell
                const pppCell = document.createElement('td');
                pppCell.className = 'total-column';
                const playersPlayed = playingCount + doneCount;
                if (playersPlayed > 0) {
                    const ppp = (team.total_points / playersPlayed).toFixed(1);
                    pppCell.textContent = ppp;
                    pppCell.title = `${team.total_points} points / ${playersPlayed} players`;
                } else {
                    pppCell.textContent = '-';
                    pppCell.title = 'No players have played yet';
                }
                row.appendChild(pppCell);

                // Total season points cell
                const seasonCell = document.createElement('td');
                seasonCell.className = 'total-column';
                seasonCell.textContent = team.total_season_points;
                seasonCell.title = `Total season points`;
                row.appendChild(seasonCell);

                tableBody.appendChild(row);
            });

            // Scale table to fit container after rendering
            setTimeout(() => scaleTableToFit(), 0);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changeGameweek(-1);
            } else if (e.key === 'ArrowRight') {
                changeGameweek(1);
            }
        });

        // Handle window/viewport size changes with debounce for performance
        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                scaleTableToFit();
            }, 100);
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        // Also trigger on zoom/fullscreen changes
        window.visualViewport?.addEventListener('resize', handleResize);

        // Force landscape orientation on mobile devices
        function requestLandscapeOrientation() {
            // Check if we're on a mobile device
            const isMobile = window.innerWidth <= 1024 || window.innerHeight <= 1024;

            if (isMobile && screen.orientation && screen.orientation.lock) {
                // Try to lock to landscape orientation
                screen.orientation.lock('landscape').catch(err => {
                    console.log('Orientation lock not supported or failed:', err);
                });
            }
        }

        // Start auto-refresh on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Request landscape orientation on mobile
            requestLandscapeOrientation();

            fetchLeagueData(); // Load immediately
            pollingInterval = setInterval(fetchLeagueData, POLL_INTERVAL); // Then poll every interval
        });
    </script>
</body>
</html>
